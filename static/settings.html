<!Doctype html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Settings</title>
        <style>
            * {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 48px 20px;
    background: #111820;
    color: #eaf4fa;
    font: 16px/1.5 system-ui, sans-serif;
}

.settings {
    width: min(100%, 640px);
    margin: 40px auto;
    padding: 32px;
    text-align: left;
    background: #1b2933;
    border: 1px solid #354852;
    border-radius: 16px;
}

h1 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 24px;
    font-weight: 600;
}

.hint {
    margin: 6px 0 12px;
    color: #a9bbc6;
}

.sys {
    display: block;
    width: 100%;
    min-height: 140px;
    padding: 12px 14px;
    resize: vertical;
    border: 1px solid #526773;
    border-radius: 10px;
    background: #111820;
    color: #fff;
    font: inherit;
}

.sys:focus {
    outline: 2px solid #3282b8;
    border-color: transparent;
}

button {
    margin-top: 14px;
    padding: 10px 16px;
    border: 0;
    border-radius: 10px;
    background: #0f69c7;
    color: white;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #3282b8;
}
        </style>
    </head>
    <body>
        <div>
            <a src="../index.html"><img src="back.png">back to Home.</a>
        </div>
        <h1>Settings</h1>
        <br>
        <p>AI system messages:</p>
        <label for="system-instructions">How should AeroAI respond?</label>
<p class="hint">For example: “Explain things simply and use short bullet points.”</p>

<textarea
    id="system-instructions"
    class="sys"
    maxlength="1000"
    placeholder="Describe the tone, detail, or format you prefer..."
></textarea>

<button id="save-settings" type="button">Save instructions</button>
<p id="save-status" aria-live="polite"></p>
    </body>
