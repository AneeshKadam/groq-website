<!DOCTYPE html>
<html>
    <head>
        <title>VeryfunandEducationalMathWebsite</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Corrected Google Fonts implementation for Geist + Geist Mono -->
        <link href="https://googleapis.com" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="./taskbar.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
        <style>
          
:root {
    --navy: #1B262C;
    --blue: #0F4C75;
    --blue-light: #3282B8;
    --ice-blue: #BBE1FA;

    --background: #1B262C;
    --surface: #24343D;
    --surface-hover: #2C404B;
    --text: #EAF4FA;
    --text-muted: #9FB5C2;
    --border: #354852;

    --radius: 14px;
}


body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background-color:#1B262C;
    background-image: 
        radial-gradient(circle at 80% 20%, rgba(15, 76, 117, 0.3) 0%, transparent 40%),
        radial-gradient(circle at 10% 80%, rgba(50, 130, 184, 0.2) 0%, transparent 40%);
    background-attachment: fixed;
}
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background-color: #1B262C;
    color: var(--text);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        "Segoe UI", sans-serif;

}

.chat-box {
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-width: 900px; /* Constrains look on wide monitors */
    width: 100%;
    margin: 20px auto; /* Centers the card nicely */
    border-radius: var(--radius);
    overflow: hidden;
    flex: 1 1 auto;
    
    /* Premium Glassmorphic Recipe */
    background: rgba(16, 24, 30, 0.65); 
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.messages {
    flex: 1;
    min-height: 0;
    width: 100%;
    padding: 28px;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    overflow-wrap: anywhere;
    scrollbar-gutter: stable;
    scrollbar-color: var(--blue-light) transparent;
    background: transparent; /* Allows main glass background to show through */
}
/* Wrapper to sit avatar and AI bubble horizontally row-by-row */
.bot-message-wrapper {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 20px;
    max-width: 85%;
    animation: message-enter 220ms cubic-bezier(0.16, 1, 0.3, 1);
}

.ai-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--blue-light));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 14px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(50, 130, 184, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.msg {
    width: fit-content;
    max-width: 85%;
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    overflow-wrap: anywhere;
    animation: message-enter 180ms ease-out;
    font-size: 15px;
}


.msg.user {
    max-width: 85%;
    margin-bottom: 20px;
    background-color: var(--blue);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-left: auto;
    border-radius: 18px 18px 4px 18px; /* Tapered edge pointing to right */
    box-shadow: 0 4px 15px rgba(15, 76, 117, 0.2);
    animation: message-enter 220ms cubic-bezier(0.16, 1, 0.3, 1);
}


.msg.bot {
    background: rgba(255, 255, 255, 0.04);
    color: #F3F4F6;
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin-right: auto;
    border-radius: 4px 18px 18px 18px; /* Map nicely next to the avatar wrapper */
    margin-bottom: 0; /* Handled by wrapper now */
}


.msg.bot a {
    color: var(--ice-blue);
    text-decoration: underline;
    text-underline-offset: 3px;
}


.msg.bot pre {
    max-width: 100%;
    overflow-x: auto;
    padding: 16px;
    margin: 14px 0;
    background: rgba(11, 17, 20, 0.8);
    color: #E2E8F0;
    border: 1px solid var(--border);
    border-radius: 10px;
    /* Codespans inherit code text engine rules cleanly */
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
}

.msg.bot code {
    font-family: 'Geist Mono', monospace;
    overflow-wrap: anywhere;
}

.msg.bot p {
    margin: 0 0 10px;
}

.msg.bot p:last-child {
    margin-bottom: 0;
}

.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    margin-top:auto;
    background-color:#1B262C;
}


.input-area input {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--radius);
    outline: none;
    font: inherit;
    transition: border-color 160ms ease,
                background 160ms ease;
    background-color:#555555;
    color:#FFFFFF;
}

.input-area input::placeholder {
    color: #7D7D7D;
}

.input-area input:focus {
    background-color:#555555;
    border-color: var(--blue-light);
}


.input-area button {
    flex-shrink: 0;
    padding: 12px 20px;
    background-color:#015AC7;
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 160ms ease,
                transform 160ms ease;
}

.input-area button:hover {
    background: var(--blue-light);
}

.input-area button:active {
    transform: scale(0.97);
}


.messages::-webkit-scrollbar {
    width: 7px;
}

.messages::-webkit-scrollbar-thumb {
    background: var(--blue-light);
    border-radius: 10px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}


@keyframes message-enter {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


::selection {
    background: var(--blue-light);
    color: #FFFFFF;
}

/* Mobile */
@media (max-width: 600px) {
    .messages {
        padding: 16px;
    }

    .msg {
        max-width: 95%;
    }

    .input-area {
        padding: 10px;
        gap: 8px;
    }

    .input-area button {
        padding: 12px 15px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
} 
            * {
                box-sizing:border-box;
            }
        </style>
    </head>
    <body>
     
   
        <div class="chat-box">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Talk to AeroAI." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
    </div>
        <script>
    let memoryMessages = [];

    // Placeholder mock setup since appendMessage logic wasn't fully supplied
    function appendMessage(text, sender) {
        const box = document.getElementById('chat-messages');
        if (sender === 'user') {
            const div = document.createElement('div');
            div.className = 'msg user';
            div.textContent = text;
            box.appendChild(div);
        }
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        memoryMessages.push({ role: "user", content: text });

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: memoryMessages })
            });
            
            if (!response.ok) {
                throw new Error(`Request failed (${response.status})`);
            }

            // 1. Create a placeholder bundle container for avatar + bubble layout
            const botBubble = createEmptyBotBubble();
            let fullAccumulatedText = "";

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                fullAccumulatedText += chunk;

                // 3. Render parsed tokens inside targeted container bubble block
                updateBotBubble(botBubble, fullAccumulatedText);
            }

            memoryMessages.push({ role: "assistant", content: fullAccumulatedText });

        } catch (error) {
            const wrapper = createEmptyBotBubble();
            wrapper.innerHTML = "Error connecting to server. Please try again.";
            console.error(error);
        }
    }

    // Generates structural outer tree wrapping inner nodes row matching layout constraints
    function createEmptyBotBubble() {
        const box = document.getElementById('chat-messages');
        
        // Build wrapper
        const wrapper = document.createElement('div');
        wrapper.className = 'bot-message-wrapper';
        
        // Build Avatar container node
        const avatar = document.createElement('div');
        avatar.className = 'ai-avatar';
        avatar.innerHTML = '<i class="fa-solid fa-robot"></i>'; // FontAwesome Icon injection
        
Use code with caution.
// Build actual target rendering layout container bubble block
const msgBubble = document.createElement('div');
msgBubble.className = 'msg bot';
// Stitch nodes together
wrapper.appendChild(avatar);
wrapper.appendChild(msgBubble);
box.appendChild(wrapper);
box.scrollTop = box.scrollHeight;
return msgBubble; // Return reference directly to text element block for updates
}
function updateBotBubble(element, text) {
const box = document.getElementById('chat-messages');
if (window.marked && typeof window.marked.parse === 'function') {
const renderedMarkdown = window.marked.parse(text, { gfm: true, breaks: true });
if (window.DOMPurify) {
element.innerHTML = window.DOMPurify.sanitize(renderedMarkdown);
} else {
element.textContent = text;
}
} else {
element.textContent = text;
}
box.scrollTop = box.scrollHeight;
}


  </script>
    </body>
</html>
