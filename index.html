<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Groq Chatbot with Memory</title>
    <!-- 1. Include Marked library to parse bullet points and bold text automatically -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e2e; display: flex; justify-content: center; padding: 20px; color: #fff; margin: 0; }
        .chat-box { width: 100%; max-width: 650px; background: #252538; border-radius: 12px; display: flex; flex-direction: column; height: 85vh; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.5; }
        .user { background: #89b4fa; color: #11111b; align-self: flex-end; }
        .bot { background: #45475a; align-self: flex-start; }
        /* Style adjustments for lists inside responses */
        .msg ul, .msg ol { margin: 5px 0; padding-left: 20px; }
        .msg p { margin: 0 0 8px 0; }
        .msg p:last-child { margin-bottom: 0; }
        .input-area { display: flex; padding: 15px; background: #181825; border-top: 1px solid #313244; }
        input { flex: 1; padding: 14px; border: none; border-radius: 6px; background: #313244; color: white; outline: none; font-size: 16px; }
        button { background: #89b4fa; border: none; padding: 0 24px; border-radius: 6px; margin-left: 10px; cursor: pointer; font-weight: bold; color: #11111b; font-size: 16px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 2. This array holds the running chat history for memory
    let memoryMessages = [];

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        // Display user message on screen
        appendMessage(text, 'user');
        input.value = '';

        // Add user text to memory array
        memoryMessages.push({ role: "user", content: text });

        // Send full memory list to your Python backend
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: memoryMessages })
        });
        
        const data = await response.json();
        
        // Add assistant response to memory array
        memoryMessages.push({ role: "assistant", content: data.reply });
        
        // Display formatted assistant message on screen
        appendMessage(data.reply, 'bot');
    }

    function appendMessage(text, sender) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        
        if (sender === 'bot') {
            // 3. Use marked.parse to instantly handle bolding, code segments, and bullet points
            div.innerHTML = marked.parse(text);
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
