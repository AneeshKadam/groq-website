<!DOCTYPE html>
<html>
    <head>
        <title>VeryfunandEducationalMathWebsite</title>
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
        <style>
          
:root {
    --navy: #1B262C;
    --blue: #0F4C75;
    --blue-light: #3282B8;
    --ice-blue: #BBE1FA;

    --background: #000000;
    --surface: #24343D;
    --surface-hover: #2C404B;
    --text: #EAF4FA;
    --text-muted: #9FB5C2;
    --border: #354852;

    --radius: 14px;
}


body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background-color:#1B262C;
}
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background-color: #1B262C;
    color: var(--text);
    font-family: 'Geist', Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

}

.chat-box {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background-color:#000000;
    border: none;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: none;
    flex: 1 1 auto;
}

.messages {
    flex: 1;
    min-height: 0;
    width: 100%;
    padding: 24px;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    overflow-wrap: anywhere;
    scrollbar-gutter: stable;
    scrollbar-color: var(--blue-light) transparent;
    background-color:#000000;
}


.msg {
    width: fit-content;
    max-width: 85%;
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    overflow-wrap: anywhere;
    animation: message-enter 180ms ease-out;
    font-size: 15px;
}


.msg.user {
    background-color:#015AC7;
    color: #FFFFFF;
    border: none;
    margin-left: auto;
    border-radius:1em;
    border-bottom-right-radius: 4px;
    padding:0.5em;
    border: 0.5px solid rgba(255, 255, 255, 0.3);
background: rgba(1, 90, 199, 0.2);
backdrop-filter: blur(2px);
font-size:1em;
    font-family:'Geist', Inter, Arial;
}


.msg.bot {
    background-color:#28282B;
    color: #FFFFFF;
    border: none;
    margin-right: auto;
    border-radius:16px;
    border-bottom-left-radius: 4px;
    padding:0.5em;
   border: 0.5px hsl(0, 0%, 100%, 0.3);
    background: hsl(0, 0%, 100%, 0.2);
        backdrop-filter: blur(2px);
    font-family:'Geist', Inter, Arial;
    font-size:1em;
}


.msg.bot a {
    color: var(--ice-blue);
    text-decoration: underline;
    text-underline-offset: 3px;
}


.msg.bot pre {
    max-width: 100%;
    overflow-x: auto;
    padding: 14px;
    margin: 12px 0;
    background: var(--navy);
    color: var(--ice-blue);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.msg.bot code {
    overflow-wrap: anywhere;
}

.msg.bot p {
    margin: 0 0 10px;
}

.msg.bot p:last-child {
    margin-bottom: 0;
}

.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    margin-top:auto;
    background-color:#000000;
}


.input-area input {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--radius);
    outline: none;
    font: inherit;
    transition: border-color 160ms ease,
                background 160ms ease;
    background-color:#555555;
    color:#FFFFFF;
}

.input-area input::placeholder {
    color: #7D7D7D;
}

.input-area input:focus {
    background-color:#555555;
    border-color: var(--blue-light);
}


.input-area button {
    flex-shrink: 0;
    padding: 12px 20px;
    background-color:#015AC7;
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 160ms ease,
                transform 160ms ease;
}

.input-area button:hover {
    background: var(--blue-light);
}

.input-area button:active {
    transform: scale(0.97);
}


.messages::-webkit-scrollbar {
    width: 7px;
}

.messages::-webkit-scrollbar-thumb {
    background: var(--blue-light);
    border-radius: 10px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}


@keyframes message-enter {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


::selection {
    background: var(--blue-light);
    color: #FFFFFF;
}

/* Mobile */
@media (max-width: 600px) {
    .messages {
        padding: 16px;
    }

    .msg {
        max-width: 95%;
    }

    .input-area {
        padding: 10px;
        gap: 8px;
    }

    .input-area button {
        padding: 12px 15px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
} 
            * {
                box-sizing:border-box;
            }
            body {
    background: var(--background);
}

.topbar {
    height: 64px;
    flex: 0 0 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--background);
}

.brand {
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
}

.new-chat,
.suggestions button {
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    font: inherit;
    cursor: pointer;
}

.new-chat:hover,
.suggestions button:hover {
    background: var(--surface-hover);
}

.chat-box {
    width: min(100%, 1000px);
    margin: 0 auto;
    background: var(--background);
}

.messages {
    padding: 32px 24px;
    background: var(--background);
}

.msg {
    max-width: min(80%, 720px);
    padding: 12px 16px;
}

.msg.bot {
    background: var(--surface);
    border: 1px solid var(--border);
}

.msg.user {
    background: var(--blue);
    border: 0;
}

.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: var(--text);
}

.welcome h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 40px);
}

.welcome p {
    margin: 0 0 24px;
    color: var(--text-muted);
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.input-area {
    position: sticky;
    bottom: 0;
    padding: 14px 24px 20px;
    background: var(--background);
}

.input-area input {
    background: var(--surface);
}

@media (max-width: 600px) {
    .topbar {
        padding: 0 16px;
    }

    .messages {
        padding: 20px 16px;
        width:100vw;
    }

    .input-area {
        padding: 10px 16px 16px;
    }

    .msg {
        max-width: 92%;
    }
}
        </style>
    </head>
    <body>
     
   <header class="topbar">
    <a class="brand" href="/">AeroAI</a>
    <button class="new-chat" onclick="newChat()">New chat</button>
</header>
        <div class="chat-box">
    <div class="messages" id="chat-messages">
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask a question, explore an idea, or create an image.</p>
            <div class="suggestions">
                <button onclick="askSuggestion('Explain a complex topic simply.')">Explain a topic</button>
                <button onclick="askSuggestion('Can you code a simple website for me?')">Code A Website</button>
                <button onclick="askSuggestion('Create an image of ')">Create an image</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Message AeroAI"
               onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
        <script>
    let memoryMessages = [];

async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    document.getElementById('welcome')?.remove();

    appendMessage(text, 'user', false);
    input.value = '';

    memoryMessages.push({ role: "user", content: text });

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                messages: memoryMessages,
                system_prompt: localStorage.getItem('aeroai-instructions') || ""})
        });
        
        if (!response.ok) {
            throw new Error(`Request failed (${response.status})`);
        }

        // 1. Create a placeholder bubble for the incoming bot stream
        const botBubble = createEmptyBotBubble();
        let fullAccumulatedText = "";

        // 2. Setup standard web stream reader
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            // Decode the modern byte chunk into strings
            const chunk = decoder.decode(value, { stream: true });
            
            // Your backend should send format "data: text\n\n" or simple text data
            // Here we assume a raw text stream chunk. Adjust parsing if using SSE strings.
            fullAccumulatedText += chunk;

            // 3. Render the parsed markdown dynamically as it grows
            updateBotBubble(botBubble, fullAccumulatedText);
        }

        // Save the final completed message string back into the conversation state
        memoryMessages.push({ role: "assistant", content: fullAccumulatedText });

    } catch (error) {
        appendMessage("Error connecting to server. Please try again.", 'bot', false);
        console.error(error);
    }
}

// Generates the initial empty DOM container wrapper for the bot
function createEmptyBotBubble() {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
}

// Updates an existing block directly with fresh decoded strings
function updateBotBubble(element, text) {
    const box = document.getElementById('chat-messages');
    
    if (window.marked && typeof window.marked.parse === 'function') {
        const renderedMarkdown = window.marked.parse(text, { gfm: true, breaks: true });
        if (window.DOMPurify) {
            element.innerHTML = window.DOMPurify.sanitize(renderedMarkdown);
        } else {
            element.textContent = text;
        }
    } else {
        element.innerText = text;
    }
    
    // Smooth lock to bottom view as typing runs down the card
    box.scrollTop = box.scrollHeight;
}

// Kept your legacy code for non-streaming / User prints
function appendMessage(text, sender, isImage) {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    
    if (sender === 'bot' && isImage) {
        const img = document.createElement('img');
        img.src = text;
        img.alt = 'AI-generated image';
        img.loading = 'lazy';
        div.appendChild(img);
    } else {
        div.innerText = text;
    }
    
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
function askSuggestion(text) {
    const input = document.getElementById('user-input');
    input.value = text;
    input.focus();

    // For the image prompt, let the user finish describing the image.
    if (text.endsWith('of ')) return;

    sendMessage();
}

function newChat() {
    memoryMessages = [];
    document.getElementById('chat-messages').innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask a question, explore an idea, or create an image.</p>
            <div class="suggestions">
                <button onclick="askSuggestion('Explain a topic simply')">Explain a topic</button>
                <button onclick="askSuggestion('Help me brainstorm ideas')">Brainstorm ideas</button>
                <button onclick="askSuggestion('Create an image of ')">Create an image</button>
            </div>
        </div>`;
}
  </script>
    </body>
</html>
