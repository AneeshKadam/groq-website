<!DOCTYPE html>
<html>
    <head>
        <title>VeryfunandEducationalMathWebsite</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="./taskbar.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
        <style>
          
:root {
    --navy: #1B262C;
    --blue: #0F4C75;
    --blue-light: #3282B8;
    --ice-blue: #BBE1FA;

    --background: #1B262C;
    --surface: #24343D;
    --surface-hover: #2C404B;
    --text: #EAF4FA;
    --text-muted: #9FB5C2;
    --border: #354852;

    --radius: 14px;
}

/* Main page */
html,
body {
    background: var(--background);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
}

/* Chat container */
.chat-box {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--background);
    border: none;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: none;
}

/* Messages area */
.messages {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    padding: 24px;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    overflow-wrap: anywhere;
    scrollbar-gutter: stable;
    scrollbar-color: var(--blue-light) transparent;
}

/* Shared message styling */
.msg {
    width: fit-content;
    max-width: 85%;
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    overflow-wrap: anywhere;
    animation: message-enter 180ms ease-out;
}

/* User messages */
.msg.user {
    background: var(--blue);
    color: #FFFFFF;
    border: none;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

/* AI messages */
.msg.bot {
    background: var(--surface);
    color: var(--text);
    border: none;
    margin-right: auto;
    border-bottom-left-radius: 4px;
}

/* Links inside AI responses */
.msg.bot a {
    color: var(--ice-blue);
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* Code blocks in AI responses */
.msg.bot pre {
    max-width: 100%;
    overflow-x: auto;
    padding: 14px;
    margin: 12px 0;
    background: var(--navy);
    color: var(--ice-blue);
    border: 1px solid var(--border);
    border-radius: 10px;
}

.msg.bot code {
    overflow-wrap: anywhere;
}

.msg.bot p {
    margin-bottom: 10px;
}

.msg.bot p:last-child {
    margin-bottom: 0;
}

/* Input area */
.input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    background: var(--background);
    border-top: 1px solid var(--border);
}

/* Text input */
.input-area input {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--radius);
    outline: none;
    font: inherit;
    transition: border-color 160ms ease,
                background 160ms ease;
}

.input-area input::placeholder {
    color: var(--text-muted);
}

.input-area input:focus {
    background: var(--surface-hover);
    border-color: var(--blue-light);
}

/* Send button */
.input-area button {
    flex-shrink: 0;
    padding: 12px 20px;
    background: var(--blue);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 160ms ease,
                transform 160ms ease;
}

.input-area button:hover {
    background: var(--blue-light);
}

.input-area button:active {
    transform: scale(0.97);
}

/* Scrollbar */
.messages::-webkit-scrollbar {
    width: 7px;
}

.messages::-webkit-scrollbar-thumb {
    background: var(--blue-light);
    border-radius: 10px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}

/* Simple animation */
@keyframes message-enter {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Text selection */
::selection {
    background: var(--blue-light);
    color: #FFFFFF;
}

/* Mobile */
@media (max-width: 600px) {
    .messages {
        padding: 16px;
    }

    .msg {
        max-width: 95%;
    }

    .input-area {
        padding: 10px;
        gap: 8px;
    }

    .input-area button {
        padding: 12px 15px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
        </style>
    </head>
    <body>
     
    <div class="taskbar">
        <div class="taskbar-nav" id="taskbar-nav">
            <div class="table-highlight" id="table-highlight" aria-hidden="true"></div>
            <table id="taskbar-table">
                <tbody><tr>
                    <td class="taskbar-object"><a class="test" href="game.html"><img src="./gamepad.png" class="taskbar-icon" alt="">Games</a></td>
                    <td class="taskbar-object"><a class="test" href="./index.html"><img src="Robo.png">AeroAI</a></td>
                    <td class="taskbar-object"><a class="test" href="./index.html"><img src="Home.png">Home</a></td>
                </tr>
            </tbody></table>
        </div>
    </div>
        <div class="chat-box">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Hey its me. its AeroAI. Ask me anything!" onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
        <script>
    let memoryMessages = [];

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user', false);
        input.value = '';

        memoryMessages.push({ role: "user", content: text });

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: memoryMessages })
            });
            
            const data = await response.json();
            
            if (!response.ok && !data.reply) {
                throw new Error(`Request failed (${response.status})`);
            }

            if (data.reply) {
                // If it's an image, we display the image but save a text notice in memory
                if (data.is_image) {
                    memoryMessages.push({ role: "assistant", content: `[Generated Image: ${data.reply}]` });
                    appendMessage(data.reply, 'bot', true);
                } else {
                    memoryMessages.push({ role: "assistant", content: data.reply });
                    appendMessage(data.reply, 'bot', false);
                }
            } else {
                appendMessage("Error: Empty response content received.", 'bot', false);
            }
        } catch (error) {
            appendMessage("Error connecting to server. Please try again.", 'bot', false);
            console.error(error);
        }
    }

    // UPDATED FUNCTION: accepts an isImage true/false flag
    function appendMessage(text, sender, isImage) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        
        if (sender === 'bot') {
            if (isImage) {
                // Renders a beautiful fluid responsive image block
                const img = document.createElement('img');
                img.src = text;
                img.alt = 'AI-generated image';
                img.loading = 'lazy';
                div.appendChild(img);
            } else if (window.marked && typeof window.marked.parse === 'function') {
                const renderedMarkdown = window.marked.parse(text, { gfm: true, breaks: true });
                if (window.DOMPurify) {
                    div.innerHTML = window.DOMPurify.sanitize(renderedMarkdown);
                } else {
                    div.textContent = text;
                }
            } else {
                div.innerText = text;
            }
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
  </script>
    </body>
</html>
