<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Groq Chatbot with Memory</title>
    <!-- 1. Stable global library script loader -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/devchauhann/fonts@v1.1.0/cdn/v1/css/all.css');
        body { font-family: 'DM Sans', sans-serif; background: #1e1e2e; display: flex; justify-content: center; padding: 20px; color: #fff; margin: 0; }
        .chat-box { width: 100vw; background: #252538; border-radius: 12px; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.5; font-size: 16px; }
        .user { background: #152238; color: #11111b; align-self: flex-end; }
        .bot { background: #152238; align-self: flex-start; }
        
        /* Styled layouts for markdown text components */
        .msg ul, .msg ol { margin: 8px 0; padding-left: 20px; color: #f5e0dc; }
        .msg li { margin-bottom: 4px; }
        .msg p { margin: 0 0 8px 0; }
        .msg p:last-child { margin-bottom: 0; }
        .msg strong { color: #f9e2af; font-weight: bold; }
        
        .input-area { display: flex; padding: 15px; background: #181825; border-top: 1px solid #313244; }
        input { flex: 1; padding: 14px; border: none; border-radius: 6px; background: #313244; color: white; outline: none; font-size: 16px; }
        button { background: #89b4fa; border: none; padding: 0 24px; border-radius: 6px; margin-left: 10px; cursor: pointer; font-weight: bold; color: #11111b; font-size: 16px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Hey its me. its AeroAI. Ask me anything!" onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let memoryMessages = [];

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user', false);
        input.value = '';

        memoryMessages.push({ role: "user", content: text });

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: memoryMessages })
            });
            
            const data = await response.json();
            
            if (data.reply) {
                // If it's an image, we display the image but save a text notice in memory
                if (data.is_image) {
                    memoryMessages.push({ role: "assistant", content: `[Generated Image: ${data.reply}]` });
                    appendMessage(data.reply, 'bot', true);
                } else {
                    memoryMessages.push({ role: "assistant", content: data.reply });
                    appendMessage(data.reply, 'bot', false);
                }
            } else {
                appendMessage("Error: Empty response content received.", 'bot', false);
            }
        } catch (error) {
            appendMessage("Error connecting to server. Please try again.", 'bot', false);
            console.error(error);
        }
    }

    // UPDATED FUNCTION: accepts an isImage true/false flag
    function appendMessage(text, sender, isImage) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        
        if (sender === 'bot') {
            if (isImage) {
                // Renders a beautiful fluid responsive image block
                div.innerHTML = `<img src="${text}" alt="AI Generated Image" style="width:100%; border-radius:8px; margin-top:5px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">`;
            } else if (window.marked && typeof window.marked.parse === 'function') {
                div.innerHTML = window.marked.parse(text);
            } else {
                div.innerText = text;
            }
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
