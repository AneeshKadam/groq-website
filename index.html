<!DOCTYPE html>
<html>
    <head>
        <title>VeryfunandEducationalMathWebsite</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="./taskbar.js" defer></script>
        <style>
          :root { --vh: 1dvh; }
            h2 {
                color:orangered;
                font-family: "Agdasima", sans-serif;
                font-size:x-large;
                text-align: center;
            }
            h1 {
                color:orangered;
                font-family: "Agdasima", sans-serif;
            }
            .pic {
                width:250px;
            }
            .pic2 {
                width:185px;
                margin-right: 20px;
                margin-left:20px;
            }
            table {
                margin-right: auto;
                border-spacing: 20px;
            }
             body {
              width: 100vw;
              height: 100dvh;
              margin: 0;
              font-family: sans-serif;
              background-color: #fff;
              overflow: hidden;
              padding: 0;
              box-sizing: border-box;
            }
            
        .taskbar-nav {
  position: relative;
  display: inline-block;
  padding: 4px;
  border-radius: 20px;
  background-color: #000;
  z-index:2;
}

table {
  position: relative;
  z-index: 2;
  border-collapse: collapse;
}

td {
  position: relative;
  padding: 10px 20px;

  cursor: pointer;
  border-radius: 18px;
  white-space: nowrap;

}

/* The moving purple pill */
.table-highlight {
  position: absolute;
    z-index: 1;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-radius: 18px;

    background: linear-gradient(120deg, #02066F, #0FF0FC);

    transition:
        left 0.6s cubic-bezier(.22, 1, 0.36, 1),
        top 0.6s cubic-bezier(.22, 1, 0.36, 1),
        width 0.6s cubic-bezier(.22, 1, 0.36, 1),
        height 0.6s cubic-bezier(.22, 1, 0.36, 1);
    
    pointer-events: none;
}
.test {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #fff;
    text-decoration: none;

    transition:
        color 0.3s ease,
        gap 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}

.taskbar-icon {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;

    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.taskbar-object:hover .test {
    gap: 10px;
}

.taskbar-object:hover .taskbar-icon {
    transform: scale(1.12);
}
            #main-site {
              position: fixed;
              width: 100vw;
              height: 100dvh;
              padding: 0;
              overflow: hidden;
              background: transparent;
              z-index: 1;
              display: none;
            }
            iframe {
              position: absolute;
              inset: 0;
              display: block;
              width: 100%;
              height: 100%;
              border: 0;
            }
            * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
            
    body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #FFF;
  position: relative;
}
        </style>
    </head>
    <body>
     
    <div class="taskbar">
        <div class="taskbar-nav" id="taskbar-nav">
            <div class="table-highlight" id="table-highlight" aria-hidden="true"></div>
            <table id="taskbar-table">
                <tbody><tr>
                    <td class="taskbar-object"><a class="test" href="game.html"><img src="./gamepad.png" class="taskbar-icon" alt="">Games</a></td>
                    <td class="taskbar-object"><a class="test" href="./index.html"><i class="fa-solid fa-robot taskbar-icon" aria-hidden="true"></i>AeroAI</a></td>
                    <td class="taskbar-object"><a class="test" href="./index.html"><i class="fa-solid fa-house taskbar-icon" aria-hidden="true"></i>Home</a></td>
                </tr>
            </tbody></table>
        </div>
    </div>
        <div class="chat-box">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Hey its me. its AeroAI. Ask me anything!" onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
        <script>
    let memoryMessages = [];

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user', false);
        input.value = '';

        memoryMessages.push({ role: "user", content: text });

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: memoryMessages })
            });
            
            const data = await response.json();
            
            if (data.reply) {
                // If it's an image, we display the image but save a text notice in memory
                if (data.is_image) {
                    memoryMessages.push({ role: "assistant", content: `[Generated Image: ${data.reply}]` });
                    appendMessage(data.reply, 'bot', true);
                } else {
                    memoryMessages.push({ role: "assistant", content: data.reply });
                    appendMessage(data.reply, 'bot', false);
                }
            } else {
                appendMessage("Error: Empty response content received.", 'bot', false);
            }
        } catch (error) {
            appendMessage("Error connecting to server. Please try again.", 'bot', false);
            console.error(error);
        }
    }

    // UPDATED FUNCTION: accepts an isImage true/false flag
    function appendMessage(text, sender, isImage) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        
        if (sender === 'bot') {
            if (isImage) {
                // Renders a beautiful fluid responsive image block
                div.innerHTML = `<img src="${text}" alt="AI Generated Image" style="width:100%; border-radius:8px; margin-top:5px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">`;
            } else if (window.marked && typeof window.marked.parse === 'function') {
                div.innerHTML = window.marked.parse(text);
            } else {
                div.innerText = text;
            }
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
  </script>
    </body>
</html>
