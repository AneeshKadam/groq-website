<!DOCTYPE html>
<html>
    <head>
        <title>VeryfunandEducationalMathWebsite</title>
        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
     
   <header class="topbar">
    <a class="brand" href="/">AeroAI</a>
       <a href="../settings.html" class="settings"><img src-="settings.png" class="icon">Settings</a>
    <button class="new-chat" onclick="newChat()">New chat</button>
</header>
        <div class="chat-box">
    <div class="messages" id="chat-messages">
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask a question, explore an idea, or create an image.</p>
            <div class="suggestions">
                <button onclick="askSuggestion('Explain a complex topic simply.')">Explain a topic</button>
                <button onclick="askSuggestion('Can you code a simple website for me?')">Code A Website</button>
                <button onclick="askSuggestion('Create an image of ')">Create an image</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Message AeroAI"
               onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
        <script>
    let memoryMessages = [];

async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    document.getElementById('welcome')?.remove();

    appendMessage(text, 'user', false);
    input.value = '';

    memoryMessages.push({ role: "user", content: text });

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                messages: memoryMessages,
                system_prompt: localStorage.getItem('aeroai-instructions') || ""})
        });
        
        if (!response.ok) {
            throw new Error(`Request failed (${response.status})`);
        }

        // 1. Create a placeholder bubble for the incoming bot stream
        const botBubble = createEmptyBotBubble();
        let fullAccumulatedText = "";

        // 2. Setup standard web stream reader
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            // Decode the modern byte chunk into strings
            const chunk = decoder.decode(value, { stream: true });
            
            // Your backend should send format "data: text\n\n" or simple text data
            // Here we assume a raw text stream chunk. Adjust parsing if using SSE strings.
            fullAccumulatedText += chunk;

            // 3. Render the parsed markdown dynamically as it grows
            updateBotBubble(botBubble, fullAccumulatedText);
        }

        // Save the final completed message string back into the conversation state
        memoryMessages.push({ role: "assistant", content: fullAccumulatedText });

    } catch (error) {
        appendMessage("Error connecting to server. Please try again.", 'bot', false);
        console.error(error);
    }
}

// Generates the initial empty DOM container wrapper for the bot
function createEmptyBotBubble() {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
}

// Updates an existing block directly with fresh decoded strings
function updateBotBubble(element, text) {
    const box = document.getElementById('chat-messages');
    
    if (window.marked && typeof window.marked.parse === 'function') {
        const renderedMarkdown = window.marked.parse(text, { gfm: true, breaks: true });
        if (window.DOMPurify) {
            element.innerHTML = window.DOMPurify.sanitize(renderedMarkdown);
            addCodeCopyButtons(element);
        } else {
            element.textContent = text;
        }
    } else {
        element.innerText = text;
    }
    
    // Smooth lock to bottom view as typing runs down the card
    box.scrollTop = box.scrollHeight;
}

// Kept your legacy code for non-streaming / User prints
function appendMessage(text, sender, isImage) {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    
    if (sender === 'bot' && isImage) {
        const img = document.createElement('img');
        img.src = text;
        img.alt = 'AI-generated image';
        img.loading = 'lazy';
        div.appendChild(img);
    } else {
        div.innerText = text;
    }
    
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
function askSuggestion(text) {
    const input = document.getElementById('user-input');
    input.value = text;
    input.focus();

    // For the image prompt, let the user finish describing the image.
    if (text.endsWith('of ')) return;

    sendMessage();
}

function newChat() {
    memoryMessages = [];
    document.getElementById('chat-messages').innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask a question, explore an idea, or create an image.</p>
            <div class="suggestions">
                <button onclick="askSuggestion('Explain a topic simply')">Explain a topic</button>
                <button onclick="askSuggestion('Help me brainstorm ideas')">Brainstorm ideas</button>
                <button onclick="askSuggestion('Create an image of ')">Create an image</button>
            </div>
        </div>`;
}
            function addCodeCopyButtons(element) {
    element.querySelectorAll("pre").forEach((pre) => {
        if (pre.querySelector(".copy-code")) return;

        const button = document.createElement("button");
        button.className = "copy-code";
        button.type = "button";
        button.textContent = "Copy";

        button.addEventListener("click", async () => {
            const code = pre.querySelector("code")?.innerText ?? pre.innerText;

            try {
                await navigator.clipboard.writeText(code);
                button.textContent = "Copied!";
                setTimeout(() => button.textContent = "Copy", 1500);
            } catch (error) {
                console.error("Could not copy code:", error);
                button.textContent = "Copy failed";
                setTimeout(() => button.textContent = "Copy", 1500);
            }
        });

        pre.appendChild(button);
    });
}
  </script>
    </body>
</html>
