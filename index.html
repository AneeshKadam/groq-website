<!DOCTYPE html>
<html>
    <head>
        <title>VeryfunandEducationalMathWebsite</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="./taskbar.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
        <style>
          :root { --vh: 1dvh; }
            h2 {
                color:orangered;
                font-family: "Agdasima", sans-serif;
                font-size:x-large;
                text-align: center;
            }
            h1 {
                color:orangered;
                font-family: "Agdasima", sans-serif;
            }
            .pic {
                width:250px;
            }
            .pic2 {
                width:185px;
                margin-right: 20px;
                margin-left:20px;
            }
            table {
                margin-right: auto;
                border-spacing: 20px;
            }
             body {
              width: 100vw;
              height: 100dvh;
              margin: 0;
              font-family: sans-serif;
              background-color: #fff;
              overflow: hidden;
              padding: 0;
              box-sizing: border-box;
            }
            
        .taskbar-nav {
  position: relative;
  display: inline-block;
  padding: 4px;
  border-radius: 20px;
  background-color: #000;
  z-index:2;
}

table {
  position: relative;
  z-index: 2;
  border-collapse: collapse;
}

td {
  position: relative;
  padding: 10px 20px;

  cursor: pointer;
  border-radius: 18px;
  white-space: nowrap;

}

/* The moving purple pill */
.table-highlight {
  position: absolute;
    z-index: 1;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-radius: 18px;

    background: linear-gradient(120deg, #02066F, #0FF0FC);

    transition:
        left 0.6s cubic-bezier(.22, 1, 0.36, 1),
        top 0.6s cubic-bezier(.22, 1, 0.36, 1),
        width 0.6s cubic-bezier(.22, 1, 0.36, 1),
        height 0.6s cubic-bezier(.22, 1, 0.36, 1);
    
    pointer-events: none;
}
.test {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #fff;
    text-decoration: none;

    transition:
        color 0.3s ease,
        gap 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}

.taskbar-icon {
    width: 20px;
    height: 20px;
    object-fit: contain;
    flex-shrink: 0;

    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.taskbar-object:hover .test {
    gap: 10px;
}

.taskbar-object:hover .taskbar-icon {
    transform: scale(1.12);
}
            #main-site {
              position: fixed;
              width: 100vw;
              height: 100dvh;
              padding: 0;
              overflow: hidden;
              background: transparent;
              z-index: 1;
              display: none;
            }
            iframe {
              position: absolute;
              inset: 0;
              display: block;
              width: 100%;
              height: 100%;
              border: 0;
            }
            * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
            
    body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #FFF;
  position: relative;
}


/* Render AI Markdown as readable rich content */
.msg.bot p { margin: 0 0 0.8em; }
.msg.bot p:last-child { margin-bottom: 0; }
.msg.bot h1, .msg.bot h2, .msg.bot h3,
.msg.bot h4, .msg.bot h5, .msg.bot h6 {
  color: inherit;
  text-align: left;
  font-family: inherit;
  margin: 0.9em 0 0.45em;
}
.msg.bot ul, .msg.bot ol { padding-left: 1.6em; margin: 0.5em 0 0.8em; }
.msg.bot li { margin: 0.25em 0; }
.msg.bot blockquote {
  margin: 0.75em 0;
  padding: 0.2em 0 0.2em 0.9em;
  border-left: 3px solid #888;
  opacity: 0.9;
}
.msg.bot pre {
  max-width: 100%;
  overflow-x: auto;
  padding: 12px;
  margin: 0.7em 0;
  border-radius: 8px;
  background: rgba(127,127,127,0.14);
}
.msg.bot code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
}
.msg.bot :not(pre) > code {
  padding: 0.12em 0.35em;
  border-radius: 4px;
  background: rgba(127,127,127,0.16);
}
.msg.bot table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0.75em 0; }
.msg.bot th, .msg.bot td { padding: 6px 10px; border: 1px solid rgba(127,127,127,0.45); white-space: normal; cursor: auto; }
.msg.bot a { overflow-wrap: anywhere; }
.msg.bot hr { border: 0; border-top: 1px solid rgba(127,127,127,0.4); margin: 0.8em 0; }

/* Keep the conversation inside the viewport while allowing long replies to scroll. */
.taskbar {
  flex: 0 0 auto;
  position: relative;
  z-index: 5;
  padding: 12px;
}
.chat-box {
  display: flex;
  flex-direction: column;
  width: min(900px, calc(100% - 24px));
  height: calc(100dvh - 82px);
  min-height: 0;
  margin: 0 auto;
  padding: 12px;
  gap: 12px;
}
.messages {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  overflow-wrap: anywhere;
  padding: 12px;
  border-radius: 12px;
  scrollbar-gutter: stable;
}
.msg {
  max-width: 100%;
  margin: 0 0 12px;
  padding: 10px 14px;
  border-radius: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.msg img {
  display: block;
  max-width: 100%;
  height: auto;
}
.msg.user {
  margin-left: auto;
  width: fit-content;
  max-width: 85%;
}
.msg.bot {
  width: fit-content;
  max-width: 100%;
}
.input-area {
  display: flex;
  flex: 0 0 auto;
  gap: 8px;
  padding-bottom: max(4px, env(safe-area-inset-bottom));
}
.input-area input {
  flex: 1 1 auto;
  min-width: 0;
  padding: 12px;
  border: 1px solid #999;
  border-radius: 10px;
  font: inherit;
}
.input-area button {
  flex: 0 0 auto;
  padding: 10px 16px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
@media (max-height: 500px) {
  .chat-box { height: calc(100dvh - 66px); }
}

        </style>
    </head>
    <body>
     
    <div class="taskbar">
        <div class="taskbar-nav" id="taskbar-nav">
            <div class="table-highlight" id="table-highlight" aria-hidden="true"></div>
            <table id="taskbar-table">
                <tbody><tr>
                    <td class="taskbar-object"><a class="test" href="game.html"><img src="./gamepad.png" class="taskbar-icon" alt="">Games</a></td>
                    <td class="taskbar-object"><a class="test" href="./index.html"><i class="fa-solid fa-robot taskbar-icon" aria-hidden="true"></i>AeroAI</a></td>
                    <td class="taskbar-object"><a class="test" href="./index.html"><i class="fa-solid fa-house taskbar-icon" aria-hidden="true"></i>Home</a></td>
                </tr>
            </tbody></table>
        </div>
    </div>
        <div class="chat-box">
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Hey its me. its AeroAI. Ask me anything!" onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
        <script>
    let memoryMessages = [];

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user', false);
        input.value = '';

        memoryMessages.push({ role: "user", content: text });

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: memoryMessages })
            });
            
            const data = await response.json();
            
            if (!response.ok && !data.reply) {
                throw new Error(`Request failed (${response.status})`);
            }

            if (data.reply) {
                // If it's an image, we display the image but save a text notice in memory
                if (data.is_image) {
                    memoryMessages.push({ role: "assistant", content: `[Generated Image: ${data.reply}]` });
                    appendMessage(data.reply, 'bot', true);
                } else {
                    memoryMessages.push({ role: "assistant", content: data.reply });
                    appendMessage(data.reply, 'bot', false);
                }
            } else {
                appendMessage("Error: Empty response content received.", 'bot', false);
            }
        } catch (error) {
            appendMessage("Error connecting to server. Please try again.", 'bot', false);
            console.error(error);
        }
    }

    // UPDATED FUNCTION: accepts an isImage true/false flag
    function appendMessage(text, sender, isImage) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        
        if (sender === 'bot') {
            if (isImage) {
                // Renders a beautiful fluid responsive image block
                const img = document.createElement('img');
                img.src = text;
                img.alt = 'AI-generated image';
                img.loading = 'lazy';
                div.appendChild(img);
            } else if (window.marked && typeof window.marked.parse === 'function') {
                const renderedMarkdown = window.marked.parse(text, { gfm: true, breaks: true });
                div.innerHTML = window.DOMPurify
                    ? window.DOMPurify.sanitize(renderedMarkdown)
                    : document.createTextNode(text).textContent;
            } else {
                div.innerText = text;
            }
        } else {
            div.innerText = text;
        }
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
  </script>
    </body>
</html>
