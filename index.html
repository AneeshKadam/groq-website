<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Groq Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: gray; display: flex; justify-content: center; padding: 20px; color: #fff; }
        .chat-box { width: 100vw; background: #252538; border-radius: 12px; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .user { color: white; align-self: flex-end; }
        .bot { color: white; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; background: #181825; }
        input { flex: 1; padding: 12px; border: none; border-radius: 6px; background: #313244; color: white; outline: none; }
        button { background: #89b4fa; border: none; padding: 0 20px; border-radius: 6px; margin-left: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="bar"><img src="Scramjet-App-main/public/aero.png">
    <p>AeroAI</p></div>
    <div class="messages" id="chat-messages"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask Me Anything..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';

        // Send user prompt to your Python backend
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        
        const data = await response.json();
        appendMessage(data.reply, 'bot');
    }

    function appendMessage(text, sender) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
